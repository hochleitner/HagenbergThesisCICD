name: Auto-Build & Commit PDFs

on:
  push:
    branches: [ ci-test, main ]
    # WICHTIG: Commits, die NUR PDFs/ZIPs verändern (vom Bot),
    # triggern den Workflow NICHT erneut -> keine Endlosschleife.
    paths-ignore:
      - 'documents/**/*.pdf'
      - 'documents/**/*.zip'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}  # <-- verhindert Self-trigger-Loops
    runs-on: ubuntu-latest

    permissions:
      contents: write  # nötig für Commit & Push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # damit wir sauber committen/pushen können

      - name: Show repo layout (debug)
        run: |
          pwd
          ls -la
          echo "--- documents ---"
          ls -la documents || true

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          # Sicherste Variante: volles TeX Live (schneller geht auch, aber das ist stressfrei)
          sudo apt-get install -y texlive-full latexmk biber zip make

      - name: Show LaTeX versions (debug)
        run: |
          latexmk -v || true
          pdflatex --version || true
          biber --version || true

      # Falls dein "makefile" NICHT im Repo-Root liegt, sondern z.B. in ./makefiles/,
      # setze working-directory entsprechend. Beispiel:
      # working-directory: makefiles
      - name: Build all documents
        working-directory: dev
        run: make all
        
      - name: Check ZIP diffs
        run: |
          for z in documents/*.zip; do
            echo ">>> $z"
            unzip -l "$z" | head -n 10
          done
          git status
          git diff --name-only documents/*.zip || true


      - name: Commit & push all modified files
        run: |
          set -e

          # Git identity for the bot
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Changed files before staging ==="
          git status --porcelain || true

          # Stage EVERYTHING that's modified/added/deleted (repo-weit)
          git add -A

          # Nothing to commit? exit cleanly.
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Helpful commit message incl. short SHA of triggering commit
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          git commit -m "auto: rebuild PDFs, ZIPs & dev updates (from ${SHORT_SHA})"

          # Push back to the same branch
          git push
