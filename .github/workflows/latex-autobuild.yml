name: Automatic Full Rebuild (Makefile in latex-action)

on:
  push:
    branches: [ ci-test, main ]
    paths-ignore:
      - 'documents/**/*.pdf'
      - 'documents/**/*.zip'
      - 'download/*.zip'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # latex-action needs a root_file;
      - name: Create dummy LaTeX file
        run: |
          mkdir -p .github
          cat > .github/latex-dummy.tex <<'EOF'
          \documentclass{article}
          \begin{document}dummy\end{document}
          EOF

      - name: Run Makefile inside latest TeX Live (via latex-action)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: .github/latex-dummy.tex
          work_in_root_file_dir: false
          extra_system_packages: make zip rsync findutils biber
          pre_compile: |
            set -e
            make -C dev all

      - name: Commit & push changes
        run: |
          set -e
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          git commit -m "auto: full rebuild (Makefile inside latest TeX Live, from ${SHORT_SHA})"
          git push
