name: Automatic Full Rebuild (latex-action)

on:
  push:
    branches: [ ci-test-latex-action, main ]
    # Skip runs if commits only change generated artifacts
    paths-ignore:
      - 'documents/**/*.pdf'
      - 'documents/**/*.zip'
      - 'download/*.zip'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    # Prevent infinite loops (skip runs triggered by the bot's own commit)
    if: ${{ github.actor != 'github-actions[bot]' }}

    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to push commits back to the repository

    env:
      DOCSDIR: documents
      MANUALDIR: manual
      SOURCEDIR: dev/texmf/tex/latex/hagenberg-thesis
      SOURCEDIRFOREIGN: dev/texmf/tex/latex-foreign
      BIBTEXDIR: dev/texmf/bibtex/bib
      DOWNLOADDIR: download
      CTANDIR: dev/ctan
      CTANBUNDLE: hagenberg-thesis
      CTANREADMEFILE: README.md
      CTANVERSIONTAG: "### Version:"

    steps:
      # 1) Checkout repository (full history for clean pushes)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Set release date (yyyy/mm/dd) as environment variable
      - name: Set release date
        run: echo "RELEASEDATE=$(date +'%Y/%m/%d')" >> "$GITHUB_ENV"

      # 3) Update release dates in .sty/.cls/.bib (equivalent to `make setdates`)
      - name: Update release dates in class/style/bib files
        shell: bash
        run: |
          set -e
          DATEPATTERN='\[[0-9]\{4\}\/[0-9]\{2\}\/[0-9]\{2\}\]%%AUTO'
          sed -i "s|$DATEPATTERN|[${RELEASEDATE}]%%AUTO|g" "$SOURCEDIR"/*.sty "$SOURCEDIR"/*.cls "$BIBTEXDIR"/*.bib

      # 4) Sync shared files into each document folder (like Makefile target for documents)
      - name: Sync shared files into document folders
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for d in "$DOCSDIR"/*/ ; do
            [ -d "$d" ] || continue
            for f in "$SOURCEDIR"/*.sty "$SOURCEDIR"/*.cls "$SOURCEDIR"/*.pdf; do cp -u "$f" "$d" || true; done
            if [ -d "$SOURCEDIRFOREIGN" ]; then
              for f in "$SOURCEDIRFOREIGN"/*.sty; do cp -u "$f" "$d" || true; done
            fi
            for f in "$BIBTEXDIR"/*.bib; do cp -u "$f" "$d" || true; done
          done

      # 5) Sync shared files into manual folder (like Makefile target manual)
      - name: Sync shared files into manual folder
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          mkdir -p "$MANUALDIR"
          for f in "$SOURCEDIR"/*.sty "$SOURCEDIR"/*.cls; do cp -u "$f" "$MANUALDIR" || true; done
          if [ -d "$SOURCEDIRFOREIGN" ]; then
            for f in "$SOURCEDIRFOREIGN"/*.sty; do cp -u "$f" "$MANUALDIR" || true; done
          fi

      # 6) Compile all documents and the manual with the latest TeX Live
      - name: Compile all documents (latest TeX Live)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            documents/*/main.tex
            manual/main.tex
          work_in_root_file_dir: true
          extra_system_packages: zip rsync findutils biber

      # 7) Create ZIP archives in download/ (exactly like the new Makefile)
      - name: Create ZIP archives into download/
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          mkdir -p "$DOWNLOADDIR"
          for d in "$DOCSDIR"/*/ ; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            rm -f "$DOWNLOADDIR/$name.zip"
            ( cd "$DOCSDIR" && zip -r -q "../$DOWNLOADDIR/$name.zip" "$name" )
          done

      # 8) Cleanup document folders (keep only main.tex, main.pdf, hgbreferences.bib, and subfolders)
      - name: Cleanup document folders
        shell: bash
        run: |
          set -e
          for d in "$DOCSDIR"/*/ ; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 -type f ! -name "main.tex" ! -name "main.pdf" ! -name "hgbreferences.bib" -delete
          done

      # 9) Cleanup manual folder (keep only main.tex and main.pdf)
      - name: Cleanup manual folder
        shell: bash
        run: |
          set -e
          if [ -d "$MANUALDIR" ]; then
            find "$MANUALDIR" -maxdepth 1 -type f ! -name "main.tex" ! -name "main.pdf" -delete
          fi

      # 10) Build CTAN bundle (equivalent to Makefile target ctan)
      - name: Build CTAN bundle
        shell: bash
        run: |
          set -e
          shopt -s nullglob

          LATEX_DIR="$CTANDIR/$CTANBUNDLE/latex"
          BIBTEX_DIR="$CTANDIR/$CTANBUNDLE/bibtex"
          DOC_DIR="$CTANDIR/$CTANBUNDLE/doc"

          mkdir -p "$LATEX_DIR" "$BIBTEX_DIR" "$DOC_DIR"
          find "$LATEX_DIR"  -maxdepth 1 -type f -delete || true
          find "$BIBTEX_DIR" -maxdepth 1 -type f -delete || true
          find "$DOC_DIR"    -maxdepth 1 -type f -delete || true

          # Copy class/style PDFs and .bib files into the CTAN tree
          for f in "$SOURCEDIR"/*.sty "$SOURCEDIR"/*.cls "$SOURCEDIR"/*.pdf; do cp -u "$f" "$LATEX_DIR" || true; done
          for f in "$BIBTEXDIR"/*.bib; do cp -u "$f" "$BIBTEX_DIR" || true; done

          # Copy manual source and tutorial PDFs
          cp -u "$MANUALDIR/main.tex" "$DOC_DIR/${CTANBUNDLE}.tex"
          cp -u "$MANUALDIR/main.pdf" "$DOC_DIR/${CTANBUNDLE}.pdf"
          cp -u "$DOCSDIR/HgbThesisTutorialEN/main.pdf" "$DOC_DIR/${CTANBUNDLE}-tutorial-en.pdf"
          cp -u "$DOCSDIR/HgbThesisTutorialDE/main.pdf" "$DOC_DIR/${CTANBUNDLE}-tutorial-de.pdf"

          # Update version number in CTAN README
          CTAN_README="$CTANDIR/$CTANBUNDLE/$CTANREADMEFILE"
          sed -i "s|^${CTANVERSIONTAG}.*$|${CTANVERSIONTAG} ${RELEASEDATE}|" "$CTAN_README"

          # Zip the complete CTAN bundle
          ( cd "$CTANDIR" && rm -f "${CTANBUNDLE}.zip" && zip -r -q "${CTANBUNDLE}.zip" "${CTANBUNDLE}" )

      # 11) Commit and push all modified files (including download/*.zip)
      - name: Commit & push changes
        shell: bash
        run: |
          set -e
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          git commit -m "auto: full rebuild via latex-action (latest TeX Live, from ${SHORT_SHA})"
          git push
